# Benchmark: Nonlinear equations  f(x) = 1/p ||Ax-b||^p
#
# Full CHO solve (no WSM) — tests exact vs inexact Hessian and AGNS variants.
# Companion config nonlinear_equations_wsm.yaml adds the WSM rank-1 methods.

problem:
  type: nonlinear_equations
  params:
    n: 100      # rows of A  (number of equations)
    m: 200      # cols of A  (dimension of x)
    p: 4
    seed: 3124

methods:
  - name: gns_exact
    label: "GNS (Exact Hessian)"
    color: "red"
    linestyle: "-"
    n_iters: 100

  - name: gns_inexact
    label: "GNS (Fisher Term)"
    color: "cyan"
    linestyle: "-"
    n_iters: 100

  - name: agns_lookahead
    label: "AGNS (Lookahead)"
    color: "green"
    linestyle: ":"
    linewidth: 2.5
    n_iters: 100

  - name: agns_iterate
    label: "AGNS (Anchored)"
    color: "orange"
    linestyle: "--"
    linewidth: 2.5
    n_iters: 100

  - name: super_newton
    label: "Super-Universal Newton"
    color: "brown"
    linestyle: "-."
    n_iters: 100

  - name: gradient
    label: "Gradient Method"
    color: "blue"
    linestyle: "-."
    n_iters: 500

  - name: fast_gradient
    label: "Fast Gradient Method"
    color: "purple"
    linestyle: "dotted"
    n_iters: 500

common:
  gamma_0: 1.0
  eps: 1.0e-8
  adaptive_search: true

output:
  save_dir: results/nonlinear_equations
  title: "Nonlinear Equations ($n=100, m=200, p=4$)"
  plot_iterations: true
  plot_time: true
  plot_grad_calls: true
  plot_matrix_inverses: true
