# Benchmark: Nonlinear equations with Woodbury-Sherman-Morrison inversion
#
# Compares exact CHO solve against rank-1 WSM solve for GNS and AGNS.
# The WSM backend exploits the rank-1 Fisher term approximation to replace
# O(m^3) Cholesky with O(m^2) Woodbury inversion — showcasing the speedup
# from the inexact Hessian + rank-1 structure.

problem:
  type: nonlinear_equations
  params:
    n: 100
    m: 200
    p: 4
    seed: 3124

methods:
  - name: gns_exact
    label: "GNS (Exact, CHO)"
    color: "red"
    linestyle: "-"
    n_iters: 100

  - name: gns_wsm
    label: "GNS (Fisher+WSM)"
    color: "cyan"
    linestyle: "-"
    n_iters: 100

  - name: agns_wsm_lookahead
    label: "AGNS-WSM (Lookahead)"
    color: "green"
    linestyle: ":"
    linewidth: 2.5
    n_iters: 100

  - name: agns_wsm_iterate
    label: "AGNS-WSM (Anchored)"
    color: "orange"
    linestyle: "--"
    linewidth: 2.5
    n_iters: 100

  - name: gradient
    label: "Gradient Method"
    color: "blue"
    linestyle: "-."
    n_iters: 500

  - name: fast_gradient
    label: "Fast Gradient Method"
    color: "purple"
    linestyle: "dotted"
    n_iters: 500

common:
  gamma_0: 1.0
  eps: 1.0e-8
  adaptive_search: true

output:
  save_dir: results/nonlinear_equations_wsm
  title: "Nonlinear Equations — WSM vs CHO ($n=100, m=200, p=4$)"
  plot_iterations: true
  plot_time: true
  plot_grad_calls: true
  plot_matrix_inverses: true
