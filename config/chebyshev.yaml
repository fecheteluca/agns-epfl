# Benchmark: Chebyshev polynomial chain  f(x) = 1/p ||u(x)||^p,  x in R^n
#
# Both gns_exact (full Hessian) and gns_inexact (J^T J approximation) are
# included.  The exact Hessian is indefinite far from the optimum — Cholesky
# fails until adaptive search has tightened gamma enough that the regularizer
# overpowers the negative eigenvalues.  gns_inexact uses the J^T J + Fisher
# approximation, which is PSD by construction and avoids these failures.

problem:
  type: chebyshev
  params:
    n: 1000
    p: 4
    seed: 3124

methods:
  - name: super_newton
    label: "Cubic Newton (Exact)"
    color: "red"
    linestyle: "-"
    n_iters: 100

  - name: gns_exact
    label: "GNS (Exact Hessian)"
    color: "magenta"
    linestyle: "-"
    n_iters: 100

  - name: gns_inexact
    label: "GNS (Inexact Hessian)"
    color: "cyan"
    linestyle: "-"
    n_iters: 100

  - name: agns_lookahead
    label: "AGNS (Lookahead)"
    color: "green"
    linestyle: ":"
    linewidth: 2.5
    n_iters: 100

  - name: agns_iterate
    label: "AGNS (Anchored)"
    color: "orange"
    linestyle: "--"
    linewidth: 2.5
    n_iters: 100

  - name: gradient
    label: "Gradient Method"
    color: "blue"
    linestyle: "-."
    n_iters: 500

  - name: fast_gradient
    label: "Fast Gradient Method"
    color: "purple"
    linestyle: "dotted"
    n_iters: 500

common:
  gamma_0: 1.0
  eps: 1.0e-8
  adaptive_search: true

output:
  save_dir: results/chebyshev
  title: "Chebyshev Polynomial Chain ($n=1000, p=4$)"
  plot_iterations: true
  plot_time: true
  plot_grad_calls: true
  plot_matrix_inverses: true
