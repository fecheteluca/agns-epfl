# Benchmark: Rosenbrock as nonlinear equations  f(x) = 1/p ||u(x)||^p
# u(x) = (1-x1, sqrt(100)*(x2-x1^2))  — Rosenbrock residuals.
#
# Low-dimensional but non-trivially nonlinear.  All methods compared
# on equal footing with f_star = f(1,1) = 0.

problem:
  type: rosenbrock_nle
  params:
    p: 5

methods:
  - name: gns_exact
    label: "GNS (Exact Hessian)"
    color: "red"
    linestyle: "-"
    n_iters: 100

  - name: gns_inexact
    label: "GNS (Inexact Hessian)"
    color: "cyan"
    linestyle: "-"
    n_iters: 100

  - name: agns_lookahead
    label: "AGNS (Lookahead)"
    color: "green"
    linestyle: ":"
    linewidth: 2.5
    n_iters: 100

  - name: agns_iterate
    label: "AGNS (Anchored)"
    color: "orange"
    linestyle: "--"
    linewidth: 2.5
    n_iters: 100

  - name: super_newton
    label: "Super-Universal Newton"
    color: "brown"
    linestyle: "-."
    n_iters: 100

  - name: gradient
    label: "Gradient Method"
    color: "blue"
    linestyle: "-."
    n_iters: 10000

  - name: fast_gradient
    label: "Fast Gradient Method"
    color: "purple"
    linestyle: "dotted"
    n_iters: 10000

common:
  gamma_0: 1.0
  eps: 1.0e-8
  adaptive_search: true

output:
  save_dir: results/rosenbrock_nle
  title: "Rosenbrock-NLE ($p=5$)"
  plot_iterations: true
  plot_time: true
  plot_grad_calls: true
