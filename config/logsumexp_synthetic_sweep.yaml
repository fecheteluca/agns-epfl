# Benchmark: LogSumExp — smaller problem for sensitivity sweep
# Intended to be run multiple times via the shell sweep script,
# overriding --seed and --output-dir on each call.

problem:
  type: logsumexp_synthetic
  params:
    n: 500
    m: 500
    mu: 0.5
    seed: 42

methods:
  - name: gns_exact
    label: "GNS (Exact)"
    color: "red"
    linestyle: "-"
    n_iters: 300

  - name: gns_inexact
    label: "GNS (Inexact)"
    color: "cyan"
    linestyle: "-"
    n_iters: 300

  - name: agns_lookahead
    label: "AGNS (Lookahead)"
    color: "green"
    linestyle: ":"
    linewidth: 2.5
    n_iters: 300

  - name: gradient
    label: "Gradient"
    color: "blue"
    linestyle: "-."
    n_iters: 1000

  - name: fast_gradient
    label: "Fast Gradient"
    color: "purple"
    linestyle: "dotted"
    n_iters: 1000

common:
  gamma_0: 1.0
  eps: 1.0e-8
  adaptive_search: true

output:
  save_dir: results/logsumexp_sweep/seed_42
  title: "LogSumExp — Sweep ($n=500, m=500, \\mu=0.5$)"
  plot_iterations: true
  plot_time: true
  plot_grad_calls: true
