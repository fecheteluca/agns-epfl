# Benchmark: LogSumExp — Mushrooms dataset (LIBSVM format)
#
# Dataset: mushrooms  (8124 samples × 112 features)
# Download: scripts/download_data.sh  (saves to data/mushrooms)
#
# The LogSumExp objective serves as a smooth approximation to the linear
# max problem; the optimum is shifted to zero by construction.

problem:
  type: logsumexp_real
  params:
    path: data/mushrooms
    mu: 0.1
    max_samples: 2000   # subsample for tractable dense Hessian experiments
    seed: 42

methods:
  - name: gns_exact
    label: "GNS (Exact Hessian)"
    color: "red"
    linestyle: "-"
    n_iters: 200

  - name: gns_inexact
    label: "GNS (Weighted Gauss-Newton)"
    color: "cyan"
    linestyle: "-"
    n_iters: 200

  - name: agns_lookahead
    label: "AGNS (Lookahead)"
    color: "green"
    linestyle: ":"
    linewidth: 2.5
    n_iters: 200

  - name: agns_iterate
    label: "AGNS (Anchored)"
    color: "orange"
    linestyle: "--"
    linewidth: 2.5
    n_iters: 200

  - name: gradient
    label: "Gradient Method"
    color: "blue"
    linestyle: "-."
    n_iters: 1000

  - name: fast_gradient
    label: "Fast Gradient Method"
    color: "purple"
    linestyle: "dotted"
    n_iters: 1000

common:
  gamma_0: 1.0
  eps: 1.0e-8
  adaptive_search: true

output:
  save_dir: results/logsumexp_real_mushrooms
  title: "LogSumExp — Mushrooms Dataset ($n=112, m=2000, \\mu=0.1$)"
  plot_iterations: true
  plot_time: true
  plot_grad_calls: true
