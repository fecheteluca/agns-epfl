# Benchmark: LogSumExp — synthetic random data (1000×1000, mu=1)
#
# Methods: exact GNS, inexact GNS (Weighted Gauss-Newton), AGNS variants,
#          Super-Newton, gradient baselines.
# Reproduces the main LogSumExp experiment from the paper/notebook.

problem:
  type: logsumexp_synthetic
  params:
    n: 1000
    m: 1000
    mu: 1.0
    seed: 3124

methods:
  - name: gns_exact
    label: "GNS (Exact Hessian)"
    color: "red"
    linestyle: "-"
    n_iters: 500

  - name: gns_inexact
    label: "GNS (Weighted Gauss-Newton)"
    color: "cyan"
    linestyle: "-"
    n_iters: 500

  - name: agns_lookahead
    label: "AGNS (Lookahead)"
    color: "green"
    linestyle: ":"
    linewidth: 2.5
    n_iters: 500

  - name: agns_iterate
    label: "AGNS (Anchored)"
    color: "orange"
    linestyle: "--"
    linewidth: 2.5
    n_iters: 500

  - name: gradient
    label: "Gradient Method"
    color: "blue"
    linestyle: "-."
    n_iters: 1000

  - name: fast_gradient
    label: "Fast Gradient Method"
    color: "purple"
    linestyle: "dotted"
    n_iters: 1000

common:
  gamma_0: 1.0
  eps: 1.0e-8
  adaptive_search: true

output:
  save_dir: results/logsumexp_synthetic
  title: "LogSumExp — Random Data ($n=1000, m=1000, \\mu=1$)"
  plot_iterations: true
  plot_time: true
  plot_grad_calls: true
  plot_matrix_inverses: false
