[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agns"
version = "0.1.0"
description = "Accelerated Gradient-Normalized Smooth Newton (AGNS) built on epfml/grad-norm-smooth"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "AGNS OptML group" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4", "black>=24.0"]
notebooks = ["jupyter>=1.0", "ipykernel>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agns = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
# Vendored upstream (verbatim, Apache-2.0) and the frozen AGNS reference are not linted.
extend-exclude = ["tests/_upstream", "tests/_reference_agns.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = [
    "E741",  # ambiguous var name l/I/O: upstream uses l2_norm etc.
    "E501",  # line length is owned by black (which does not reflow docstrings)
]

[tool.ruff.lint.per-file-ignores]
# Notebooks set a `QUICK` flag (and occasionally re-import helpers mid-cell) before the main
# imports; module-level-import ordering is not meaningful in a notebook cell.
"*.ipynb" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
