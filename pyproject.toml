[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agns"
version = "0.1.0"
description = "Gradient-regularised Newton optimisation methods: AGNS and baselines for regularised logistic regression."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Luca-Andrei Fechete", email = "luca.fechete123@gmail.com"},
]
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.13,<2",
    "scikit-learn>=1.4,<2",
    "pandas>=2.2,<3",
    "pyyaml>=6,<7",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
# Notebook execution for `python run.py` (regenerates results/).
notebooks = [
    "papermill>=2.6,<3",
    "ipykernel>=6,<7",
    "nbformat>=5,<6",
]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=4,<6",
    "ruff>=0.6,<1",
    "black>=24,<26",
    "mypy>=1.10,<2",
    "types-pyyaml",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["agns*"]

[tool.setuptools.package-data]
agns = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "slow: marks tests as slow",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",  # line length handled by formatter
    "E731",  # lambda assignments (used in dual-norm closures)
    "B008",  # function calls in default args (numpy arrays etc.)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # asserts in tests are fine

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
