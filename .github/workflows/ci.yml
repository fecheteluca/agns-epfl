name: ci

"on":
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      # Pin BLAS / OpenMP threads to 1 before any test imports numpy.
      # Mirrors the runtime pinning in scripts/run_experiments.sh so the
      # tests run under the same threading regime that produces the
      # repository's bit-stable artefacts.
      - name: Pin BLAS threads
        run: |
          echo "OMP_NUM_THREADS=1" >> "$GITHUB_ENV"
          echo "MKL_NUM_THREADS=1" >> "$GITHUB_ENV"
          echo "OPENBLAS_NUM_THREADS=1" >> "$GITHUB_ENV"
          echo "NUMEXPR_NUM_THREADS=1" >> "$GITHUB_ENV"
          echo "BLIS_NUM_THREADS=1" >> "$GITHUB_ENV"

      - name: Install dependencies from lockfile
        run: uv sync --extra dev

      - name: Lint with ruff
        run: uv run ruff check src tests

      - name: Run unit tests
        run: uv run pytest -q
