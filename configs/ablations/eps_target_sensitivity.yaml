# Sensitivity of restart density / final residual to the stopping eps.

include:
  - ../_base/problems/logsumexp_synthetic.yaml

problem:
  params:
    n: 200
    m: 200
    mu: 1.0
    seed: 0

common:
  gamma_0: 1.0
  eps: 1.0e-12
  adaptive_search: true

methods:
  - include: [../_base/methods/agns_inexact.yaml]
    n_iters: 200
  - include: [../_base/methods/agns_exact.yaml]
    n_iters: 200
  - include: [../_base/methods/agns_exact_norestart.yaml]
    n_iters: 200
  - include: [../_base/methods/gns_exact.yaml]
    n_iters: 200

output:
  save_dir: results/numerical/raw/ablation_eps_sensitivity
  title: "Ablation: stopping eps sensitivity"
