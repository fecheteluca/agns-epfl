# Sensitivity of picard_acn_2008's Picard inner loop to its two
# tuning constants: ``fp_max`` (outer Picard iteration cap) and
# ``fp_rel_tol`` (early-exit tolerance on the lambda change).
# Neither value appears in any cited paper; both are
# project-internal defaults exposed for this ablation.
#
# Two independent 1-D sweeps (same pattern as
# momentum_x_restart_grid.yaml):
#   - vary fp_max while holding fp_rel_tol at the default 0.10;
#   - vary fp_rel_tol while holding fp_max at the default 3.
# A reference run at the default (fp_max=3, fp_rel_tol=0.10) lets the
# per-campaign table read off the baseline iter-to-eps.
#
# Problem: small synthetic LogSumExp -- cheap, convex, the cleanest
# test bed for inner-loop sensitivity.  Pairs naturally with the
# rate-verification campaigns that already use LSE.

include:
  - ../_base/problems/logsumexp_synthetic.yaml

problem:
  params:
    n: 200
    m: 200
    mu: 1.0
    seed: 0

common:
  gamma_0: 1.0
  eps: 1.0e-10
  adaptive_search: true

methods:
  - include: [../_base/methods/picard_acn_2008.yaml]
    n_iters: 150
    sweep:
      param: fp_max
      values: [1, 3, 5, 10]
  - include: [../_base/methods/picard_acn_2008.yaml]
    n_iters: 150
    sweep:
      param: fp_rel_tol
      values: [0.01, 0.05, 0.10, 0.25]
  # Reference: defaults explicit so the table makes the baseline
  # visible alongside the swept variants.
  - include: [../_base/methods/picard_acn_2008.yaml]
    n_iters: 150
    fp_max: 3
    fp_rel_tol: 0.10
    label: "Picard-ACN (defaults)"
  # Anchor: gns_exact runs on the same problem for cross-method context.
  - include: [../_base/methods/gns_exact.yaml]
    n_iters: 150

output:
  save_dir: results/numerical/raw/ablation_picard_fp_grid
  title: "Ablation: picard_acn_2008 inner Picard sensitivity (LSE)"
