# momentum-schedule ablation (AGNS).
#
# The Nesterov-style schedule ``beta_k = local_k / (local_k +
# momentum_offset)`` has a hidden constant ``momentum_offset = 3``
# inherited from Nesterov 1983.  We sweep 1, 2, 3, 5, 10 to confirm
# that the default 3 is well-chosen on this convex problem.  Smaller
# values approach constant ``beta_k = 1`` (Polyak heavy-ball),
# larger values dampen momentum almost to gradient descent.

include:
  - ../_base/problems/logsumexp_synthetic.yaml

problem:
  params:
    n: 200
    m: 200
    mu: 1.0
    seed: 0

common:
  gamma_0: 1.0
  eps: 1.0e-10
  adaptive_search: true

methods:
  - include: [../_base/methods/agns_inexact.yaml]
    n_iters: 100
    sweep:
      param: momentum_offset
      values: [1.0, 2.0, 3.0, 5.0, 10.0]

  - include: [../_base/methods/super_newton.yaml]
    n_iters: 100

output:
  save_dir: results/numerical/raw/ablation_momentum
  title: "Ablation: momentum_offset (default 3, Nesterov 1983)"
