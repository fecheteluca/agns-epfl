# Picard warm-start ablation (AGNS-Theory).
#
# Tests whether warm-starting the inner Picard loop's ``lambda``
# from the previous outer iteration meaningfully reduces total
# oracle work compared to cold-starting from ``g_k_norm / gamma_prev``.
# Two-point sweep -> the figure is a side-by-side bar chart of
# wall-clock + grad calls under each setting.

include:
  - ../_base/problems/logsumexp_synthetic.yaml

problem:
  params:
    n: 200
    m: 200
    mu: 1.0
    seed: 0

common:
  gamma_0: 1.0
  eps: 1.0e-10
  adaptive_search: true

methods:
  - include: [../_base/methods/agns_theory.yaml]
    n_iters: 100
    rho: 0.7071067811865475
    theta: 0.5
    sweep:
      param: lambda_warm_start
      values: [true, false]

  - include: [../_base/methods/super_newton.yaml]
    n_iters: 100

output:
  save_dir: results/numerical/raw/ablation_warm_start
  title: "Ablation: Picard warm-start (lambda reuse across outer iters)"
