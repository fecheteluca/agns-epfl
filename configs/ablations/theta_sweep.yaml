# theta ablation (AGNS-Theory).
#
# The adaptive-search dial: the inner ``rho-strict`` loop
# geometrically decays the smoothness estimate as
# ``gamma_probe = (theta ** j) * gamma_init``.  Smaller theta -> more
# aggressive halving; larger theta -> closer to constant gamma.  The
# theory leaves theta as a tuning knob with default 0.5.  This figure
# shows the algorithm's robustness across two orders of magnitude.

include:
  - ../_base/problems/logsumexp_synthetic.yaml

problem:
  params:
    n: 200
    m: 200
    mu: 1.0
    seed: 0

common:
  gamma_0: 1.0
  eps: 1.0e-10
  adaptive_search: true

methods:
  - include: [../_base/methods/agns_theory.yaml]
    n_iters: 100
    rho: 0.7071067811865475   # pin rho to T5's optimum so we isolate theta.
    sweep:
      param: theta
      values: [0.1, 0.25, 0.5, 0.75, 0.9]

  - include: [../_base/methods/super_newton.yaml]
    n_iters: 100

output:
  save_dir: results/numerical/raw/ablation_theta
  title: "Ablation: theta (adaptive-search decay; default 0.5)"
