# restart-criterion ablation (AGNS).
#
# AGNS resets its momentum schedule when a *restart test*
# fires.  Three modes are compared:
#   * ``gradient``       (default): O'Donoghue-Candes test
#                       ``g(x_trial) . (x_trial - x_k) > 0``.
#   * ``function_value``: simpler ``f(x_trial) > f(x_k)`` test.
#   * ``none``          : never restart (degenerate -- adversarial
#                       momentum can stall the iterates).
# The figure should show ``gradient`` and ``function_value`` close
# together while ``none`` is markedly worse on at least one seed,
# justifying the default choice.

include:
  - ../_base/problems/logsumexp_synthetic.yaml

problem:
  params:
    n: 200
    m: 200
    mu: 1.0
    seed: 0

common:
  gamma_0: 1.0
  eps: 1.0e-10
  adaptive_search: true

methods:
  - include: [../_base/methods/agns_inexact.yaml]
    n_iters: 100
    sweep:
      param: restart_mode
      values: ["gradient", "function_value", "none"]

  - include: [../_base/methods/super_newton.yaml]
    n_iters: 100

output:
  save_dir: results/numerical/raw/ablation_restart
  title: "Ablation: restart criterion (AGNS; default gradient)"
