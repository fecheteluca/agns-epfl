# ρ-ablation diagnostic.
#
# The original ``rho_sweep`` campaign (six ρ values) showed an
# unexpected non-monotone failure pattern: ρ ∈ {0.5, 0.6} stall at
# median residual ~10^2 while ρ ∈ {0.3, 1/√2, 0.85, 0.95} reach
# ~10^{-11}.  Both the Picard warm-start and the inner FP_max cap
# were at their defaults (warm-start ON, FP_max = 3), so warm-start
# is *not* the cause.
#
# This diagnostic runs a 12-point ρ grid at finer resolution around
# the failure region, with FP_max varied across {1, 3, 10}, on the
# same LogSumExp problem as the original sweep.  The goal is to
# answer:
#
# - Does the non-monotone failure persist at finer ρ resolution, or
#   is it a coarse-grid sampling artifact?
# - Is the failure sensitive to the Picard inner-loop cap FP_max
#   (which would identify it as a Picard interaction)?
# - What is the actual ρ-dependence shape of the final residual?
#
# Each method entry shares the registry key ``agns_theory`` and
# differs only in (rho, fp_max); a unique YAML ``key`` per entry
# keeps the per-method pickle paths from colliding.  ``noise_seed``
# is irrelevant here (the AGNS-Theory algorithm is noise-free) but
# we still pin warm-start ON explicitly for clarity.

include:
  - ../_base/problems/logsumexp_synthetic.yaml

problem:
  params:
    n: 200
    m: 200
    mu: 1.0
    seed: 0

common:
  gamma_0: 1.0
  eps: 1.0e-10
  adaptive_search: true

methods:
  # 12-point ρ grid at FP_max = 3 (the default).  Finer than the
  # original 6-point sweep, with extra resolution between 0.5 and
  # 0.65 where the original failure region sits.
  - include: [../_base/methods/agns_theory.yaml]
    n_iters: 200
    fp_max: 3
    lambda_warm_start: true
    sweep:
      param: rho
      values:
        [0.20, 0.30, 0.40, 0.50, 0.55, 0.60, 0.65, 0.7071067811865475,
         0.75, 0.80, 0.85, 0.95]

  - include: [../_base/methods/super_newton.yaml]
    n_iters: 200

output:
  save_dir: results/numerical/raw/ablation_rho_diagnostic
  title: "Ablation: rho diagnostic (12-point grid, warm-start ON, FP_max = 3)"
