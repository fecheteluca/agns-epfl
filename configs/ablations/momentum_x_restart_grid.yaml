# 2-D ablation: momentum_offset x restart_mode grid on LSE synthetic.

include:
  - ../_base/problems/logsumexp_synthetic.yaml

problem:
  params:
    n: 200
    m: 200
    mu: 1.0
    seed: 0

common:
  gamma_0: 1.0
  eps: 1.0e-10
  adaptive_search: true

methods:
  - include: [../_base/methods/agns_inexact.yaml]
    n_iters: 150
    sweep:
      param: momentum_offset
      values: [1.0, 3.0, 10.0]
  - include: [../_base/methods/agns_inexact.yaml]
    n_iters: 150
    sweep:
      param: restart_mode
      values: ["gradient", "function_value", "none"]
  - include: [../_base/methods/gns_exact.yaml]
    n_iters: 150

output:
  save_dir: results/numerical/raw/ablation_momentum_x_restart
  title: "Ablation: momentum_offset x restart_mode (LSE)"
