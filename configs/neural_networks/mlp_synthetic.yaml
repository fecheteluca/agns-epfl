# Neural-network training: tiny Tanh-MLP on synthetic Gaussian-centroid
# data.
#
# Smooth-activation choice is deliberate: ReLU's piecewise-linear
# gradient breaks the Lipschitz-Hessian hypothesis the second-order
# methods rely on, so we use Tanh to keep the Hessian well-defined.
# AGNS competes with Adam, AdaHessian and
# L-BFGS -- the canonical NN-training baselines.

include:
  - ../_base/problems/mlp_classifier_synthetic.yaml

problem:
  params:
    n_samples: 200
    n_features: 6
    n_classes: 3
    hidden_dims: [8]
    reg: 1.0e-3
    seed: 0
    device: cpu

common:
  gamma_0: 1.0
  eps: 1.0e-8
  adaptive_search: true

methods:
  - include: [../_base/methods/agns_inexact.yaml]
    n_iters: 100
  - include: [../_base/methods/gns_exact.yaml]
    n_iters: 100
  - include: [../_base/methods/agns_exact.yaml]
    n_iters: 100
  - include: [../_base/methods/agns_exact_norestart.yaml]
    n_iters: 100
  - include: [../_base/methods/super_newton.yaml]
    n_iters: 100
  - include: [../_base/methods/lbfgs.yaml]
    n_iters: 100
  - include: [../_base/methods/adam.yaml]
    n_iters: 1000
    sweep:
      param: lr
      values: [1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1.0]
  - include: [../_base/methods/adahessian.yaml]
    n_iters: 1000
    sweep:
      param: lr
      values: [1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1.0]

output:
  save_dir: results/numerical/raw/nn_mlp
  title: "MLP classifier (synthetic, n_params=83) -- NN training"
