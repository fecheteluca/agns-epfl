# Inexact-Hessian benchmark: AGNS-Theory under bounded Hessian noise.
#
# AGNS-Inexact wraps the exact-Hessian oracle in
# :class:`InexactHessianOracle`, which adds a deterministic symmetric
# perturbation of operator norm ``delta_budget`` to every ``hess(x)``
# call.  The theoretical rate has the shape
#
#     f(x_K) - f^*  <=  C_1 L_2 D^3 / K^3  +  C_2 delta_* D^2 / K^2
#
# so the noise floor scales as ``delta_*``.  This campaign sweeps
# ``delta_budget`` across {0, 1e-3, 1e-2, 1e-1, 1, 10}: small values
# stay below the curvature term and converge to machine precision;
# large values produce a visible noise floor whose magnitude tracks
# the predicted ``delta_* D^2 / K^2`` scaling.
#
# Each entry shares the registry name ``agns_inexact`` and must
# therefore carry a unique ``key`` so the per-method pickle paths do
# not collide.  ``noise_seed`` is fixed across delta values so that
# the noise pattern is consistent at different magnitudes, making the
# noise floor's delta-dependence visible at a glance.

include:
  - ../_base/problems/logistic_regression_synthetic.yaml

problem:
  params:
    m: 1000
    n: 100
    reg: 1.0e-3
    seed: 0

common:
  gamma_0: 1.0
  eps: 1.0e-10
  adaptive_search: true

methods:
  - include: [../_base/methods/agns_inexact.yaml]
    key: agns_inexact_d0
    n_iters: 200
    delta_budget: 0.0
    noise_seed: 0
    label: "AGNS-Inexact ($\\delta=0$)"
    color: "#117733"
    linestyle: "-"

  - include: [../_base/methods/agns_inexact.yaml]
    key: agns_inexact_d1em3
    n_iters: 200
    delta_budget: 1.0e-3
    noise_seed: 0
    label: "AGNS-Inexact ($\\delta=10^{-3}$)"
    color: "#88CCEE"
    linestyle: "--"

  - include: [../_base/methods/agns_inexact.yaml]
    key: agns_inexact_d1em2
    n_iters: 200
    delta_budget: 1.0e-2
    noise_seed: 0
    label: "AGNS-Inexact ($\\delta=10^{-2}$)"
    color: "#DDCC77"
    linestyle: "-."

  - include: [../_base/methods/agns_inexact.yaml]
    key: agns_inexact_d1em1
    n_iters: 200
    delta_budget: 1.0e-1
    noise_seed: 0
    label: "AGNS-Inexact ($\\delta=10^{-1}$)"
    color: "#CC6677"
    linestyle: ":"

  - include: [../_base/methods/agns_inexact.yaml]
    key: agns_inexact_d1
    n_iters: 200
    delta_budget: 1.0
    noise_seed: 0
    label: "AGNS-Inexact ($\\delta=1$)"
    color: "#AA4499"
    linestyle: "--"

  - include: [../_base/methods/agns_inexact.yaml]
    key: agns_inexact_d10
    n_iters: 200
    delta_budget: 10.0
    noise_seed: 0
    label: "AGNS-Inexact ($\\delta=10$)"
    color: "#882255"
    linestyle: "-."

  - include: [../_base/methods/agns_practice.yaml]
    n_iters: 200
  - include: [../_base/methods/super_newton.yaml]
    n_iters: 200

output:
  save_dir: results/numerical/raw/inexact_lr_delta
  title: "Logistic regression -- inexact Hessian ($\\delta$ sweep)"
