# Scaling study: wall-clock vs. problem size n.
#
# AGNS and GNS perform one dense Hessian solve per iteration, so
# the iteration count is roughly independent of n while the
# per-iteration cost grows as O(n^3); the first-order baselines trade a
# cheaper per-iteration cost for many more iterations.  Run this config
# alongside its sibling scaling/lr_n*.yaml campaigns (one per n value)
# and compare the per-campaign wall-clock columns from the aggregated
# JSONs.
#
# This config fixes ``n = 200``.

include:
  - ../_base/problems/logistic_regression_synthetic.yaml

problem:
  params:
    m: 1000
    n: 200
    reg: 1.0e-3
    seed: 0

common:
  gamma_0: 1.0
  eps: 1.0e-8
  adaptive_search: true

methods:
  - include: [../_base/methods/agns_inexact.yaml]
    n_iters: 100
  - include: [../_base/methods/gns_exact.yaml]
    n_iters: 100
  - include: [../_base/methods/agns_exact.yaml]
    n_iters: 100
  - include: [../_base/methods/agns_exact_norestart.yaml]
    n_iters: 100
  - include: [../_base/methods/agns_inexact_norestart.yaml]
    n_iters: 100
  - include: [../_base/methods/super_newton.yaml]
    n_iters: 100
  - include: [../_base/methods/lbfgs.yaml]
    n_iters: 100
  - include: [../_base/methods/gradient.yaml]
    n_iters: 1000

output:
  save_dir: results/numerical/raw/scaling_lr_n200
  title: "Logistic regression scaling (m=1000, n in {50, 200, 800})"
