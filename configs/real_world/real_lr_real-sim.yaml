# Real-world LIBSVM benchmark on the ``real-sim`` dataset.

include:
  - ../_base/problems/logistic_regression_libsvm.yaml

problem:
  params:
    path: data/binary/real-sim
    reg: 0.001
    max_samples: 4000
    use_gram: false        # high-d sparse; dense B would OOM

common:
  gamma_0: 1.0
  eps: 1.0e-10
  adaptive_search: true

methods:
  # First-order-only roster: dense Newton-family Hessian is infeasible at
  # this feature count (see lr_rcv1.yaml for the same pattern).
  - include: [../_base/methods/lbfgs.yaml]
    n_iters: 500
  - include: [../_base/methods/gradient.yaml]
    n_iters: 1500
  - include: [../_base/methods/fast_gradient.yaml]
    n_iters: 1500
  # Adam and AdaHessian use a one-order-of-magnitude sweep over lr so
  # the chosen default isn't load-bearing for the comparison.  Five
  # values on a log grid span the range these methods are typically
  # tuned over; the per-campaign table renders one row per value.
  - include: [../_base/methods/adam.yaml]
    n_iters: 2000
    sweep:
      param: lr
      values: [1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1.0]
  - include: [../_base/methods/adahessian.yaml]
    n_iters: 1000
    sweep:
      param: lr
      values: [1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1.0]

output:
  save_dir: results/numerical/raw/real_lr_real-sim
  title: "Logistic regression on real-sim (LIBSVM)"
