# Real-world LIBSVM benchmark on the ``gisette`` dataset.

include:
  - ../_base/problems/logistic_regression_libsvm.yaml

problem:
  params:
    path: data/binary/gisette
    reg: 0.001
    max_samples: null

common:
  gamma_0: 1.0
  eps: 1.0e-10
  adaptive_search: true

methods:
  # gisette is dense n=5000 -- a dense n*n Hessian is ~200 MB and a
  # per-iter Cholesky on it takes a few seconds on a single thread.
  # That makes the GNS / AGNS family tractable at a reduced
  # iteration budget (n_iters=80 instead of 150).  The cubic-Newton
  # variants are deliberately excluded because their secular-equation
  # solve at n=5000 is several times more expensive per iter and would
  # dominate the campaign run time.  ``agns_inexact`` is also omitted:
  # the ridge / LR LIBSVM factories provide no ``approx_hess_fn``
  # for it to consume.
  - include: [../_base/methods/gns_exact.yaml]
    n_iters: 80
  - include: [../_base/methods/agns_exact.yaml]
    n_iters: 80
  - include: [../_base/methods/agns_exact_norestart.yaml]
    n_iters: 80
  - include: [../_base/methods/lbfgs.yaml]
    n_iters: 500
  - include: [../_base/methods/gradient.yaml]
    n_iters: 1500
  - include: [../_base/methods/fast_gradient.yaml]
    n_iters: 1500
  - include: [../_base/methods/adam.yaml]
    n_iters: 2000
    sweep:
      param: lr
      values: [1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1.0]
  - include: [../_base/methods/adahessian.yaml]
    n_iters: 1000
    sweep:
      param: lr
      values: [1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1, 1.0]

output:
  save_dir: results/numerical/raw/real_lr_gisette
  title: "Logistic regression on gisette (LIBSVM)"
