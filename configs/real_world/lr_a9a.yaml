# Real-world convex Lipschitz benchmark on the LIBSVM ``a9a`` dataset.
# 32,561 samples x 123 features, binary classification.
# Subsampled per-seed to introduce statistical variance.

include:
  - ../_base/problems/logistic_regression_libsvm.yaml

problem:
  params:
    path: data/binary/a9a
    reg: 1.0e-3
    max_samples: 4000      # subsample for per-seed variance

common:
  gamma_0: 1.0
  eps: 1.0e-10
  adaptive_search: true

methods:
  - include: [../_base/methods/gns_exact.yaml]
    n_iters: 150
  - include: [../_base/methods/agns_practice.yaml]
    n_iters: 150
  - include: [../_base/methods/agns_theory.yaml]
    n_iters: 150
  - include: [../_base/methods/super_newton.yaml]
    n_iters: 150
  - include: [../_base/methods/newton.yaml]
    n_iters: 150
  - include: [../_base/methods/lbfgs.yaml]
    n_iters: 150
  - include: [../_base/methods/trust_region.yaml]
    n_iters: 150
  - include: [../_base/methods/accelerated_cubic_newton.yaml]
    n_iters: 150
  - include: [../_base/methods/gradient.yaml]
    n_iters: 1500
  - include: [../_base/methods/fast_gradient.yaml]
    n_iters: 1500

output:
  save_dir: results/numerical/raw/real_lr_a9a
  title: "Logistic regression on a9a (LIBSVM)"
