# Real-world convex Lipschitz benchmark on the LIBSVM ``rcv1.binary`` dataset.
# 20,242 samples x 47,236 features, binary classification.
#
# This is the only LIBSVM dataset where a dense ``n x n`` gram matrix is
# infeasible (n = 47 k => ~16 GB), so:
#   * ``use_gram: false`` makes the factory return ``B = None``, and the
#     GNS-style dual norm collapses to Euclidean.
#   * Only Hessian-free or matrix-free methods are run: gradient,
#     fast-gradient, L-BFGS, Adam, trust-region (Steihaug-CG) and
#     AdaHessian (Hutchinson HVP).  Newton-family and GNS/AGNS methods
#     are excluded because their per-iter linear solve requires the
#     dense Hessian which would also blow up.
# The campaign is therefore a first-order / matrix-free shoot-out on a
# very high-dimensional sparse problem.

include:
  - ../_base/problems/logistic_regression_libsvm.yaml

problem:
  params:
    path: data/binary/rcv1.binary
    reg: 1.0e-3
    max_samples: 4000      # subsample for per-seed variance
    use_gram: false        # n = 47 k -- dense B/Binv would OOM

common:
  eps: 1.0e-10

methods:
  - include: [../_base/methods/lbfgs.yaml]
    n_iters: 200
  - include: [../_base/methods/gradient.yaml]
    n_iters: 2000
  - include: [../_base/methods/fast_gradient.yaml]
    n_iters: 2000
  - include: [../_base/methods/adam.yaml]
    n_iters: 2000
  - include: [../_base/methods/adahessian.yaml]
    n_iters: 500

output:
  save_dir: results/numerical/raw/real_lr_rcv1
  title: "Logistic regression on rcv1.binary (LIBSVM, 47 k features, sparse)"
