# Rate verification on Nonlinear Equations at p = 2.5.
#
# ``f(x) = (1/p) ||A x - b||^p`` with p = 2.5 gives a (L, 0.5)-H\"older
# Hessian.  The middle interior panel of the rate-verification figure.

include:
  - ../_base/problems/nonlinear_equations.yaml

problem:
  params:
    n: 50
    m: 100
    p: 2.5
    seed: 11

common:
  gamma_0: 1.0
  eps: 1.0e-12
  adaptive_search: true

methods:
  - include: [../_base/methods/gns_exact.yaml]
    n_iters: 300
  - include: [../_base/methods/gns_inexact.yaml]
    n_iters: 300
  - include: [../_base/methods/agns_practice.yaml]
    n_iters: 300
  - include: [../_base/methods/agns_theory.yaml]
    n_iters: 300
  - include: [../_base/methods/super_newton.yaml]
    n_iters: 300
  - include: [../_base/methods/accelerated_cubic_newton.yaml]
    n_iters: 300
  - include: [../_base/methods/monteiro_svaiter_acn.yaml]
    n_iters: 300
  - include: [../_base/methods/gradient.yaml]
    n_iters: 3000
  - include: [../_base/methods/fast_gradient.yaml]
    n_iters: 3000

output:
  save_dir: results/numerical/raw/rate_verification_nle_nu050
  title: "Nonlinear equations p=2.5 (n=50, m=100) -- nu = 0.5"
