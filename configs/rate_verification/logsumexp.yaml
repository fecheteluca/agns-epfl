# Rate verification on a strongly-convex LogSumExp problem.
#
# Empirical evidence for the universal Holder rate at nu = 1
# (Lipschitz Hessian): the AGNS family realises ``f(x_k) - f^star =
# O(k^{-3})``, beating Cubic-Newton's ``O(k^{-2})`` and gradient
# descent's ``O(k^{-1})``.  The headline figure is a log-log of residual
# vs iteration with the least-squares slope annotated for every curve;
# the table reports slope + R^2 + final residual per method.
#
# Problem choice: strongly-convex LogSumExp with mu = 1.  The Hessian
# is globally Lipschitz here -- the cleanest test bed for the
# universal-Holder rate at nu = 1.  Size n = m = 200 makes the
# asymptotic regime clearly visible over a 200-iter window.
#
# Horizon: 200 iters for the second-order methods, 2000 for the
# first-order baselines (so the O(k^{-1}) / O(k^{-2}) slope baselines
# are clearly visible).  Stopping tolerance ``eps = 1e-12`` keeps every
# method running long enough that the asymptotic slope is visible.
#
# Multi-seed: the reference run uses 10 seeds; for a faster smoke
# check pass ``--seeds 0 1 2`` to ``run_benchmark``.

include:
  - ../_base/problems/logsumexp_synthetic.yaml

problem:
  params:
    n: 200
    m: 200
    mu: 1.0
    seed: 0     # overridden per-seed by run_benchmark --seeds

common:
  gamma_0: 1.0
  eps: 1.0e-12
  adaptive_search: true

methods:
  # GNS family
  - include: [../_base/methods/gns_exact.yaml]
    n_iters: 200
  - include: [../_base/methods/gns_inexact.yaml]
    n_iters: 200

  # AGNS family -- the headline curves.
  - include: [../_base/methods/agns_practice.yaml]
    n_iters: 200
  - include: [../_base/methods/agns_theory.yaml]
    n_iters: 200

  # Closest second-order baselines.
  - include: [../_base/methods/super_newton.yaml]
    n_iters: 200
  - include: [../_base/methods/accelerated_cubic_newton.yaml]
    n_iters: 200
  - include: [../_base/methods/monteiro_svaiter_acn.yaml]
    n_iters: 200

  # First-order references with larger budget; gradient/fast-gradient
  # give the ``O(k^{-1})`` / ``O(k^{-2})`` slope baselines a reviewer
  # expects to see on a rate-verification figure.
  - include: [../_base/methods/gradient.yaml]
    n_iters: 2000
  - include: [../_base/methods/fast_gradient.yaml]
    n_iters: 2000

output:
  save_dir: results/numerical/raw/rate_verification
  title: "LogSumExp (n=m=200, mu=1) -- rate verification"
