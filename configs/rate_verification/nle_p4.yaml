# Rate verification on Nonlinear Equations with p = 4.
#
# Canonical degenerate-optimum rate-fit problem.  ``f(x) = (1/p)
# sum_i |a_i^T x - b_i|^p`` with ``p = 4`` is convex but its Hessian
# vanishes at the optimum, so methods cannot escape the asymptotic
# polynomial regime by reaching a quadratic basin -- the AGNS slope
# matches the predicted -(2 + nu) cleanly.
#
# Companion to ``logsumexp.yaml``: that one is the strongly-convex
# sanity check (methods converge to the floating-point floor); this
# one is the canonical rate-verification benchmark.
#
# NOTE on problem sizing.  At n=20, m=40 the methods converge to the
# floating-point floor (~1e-14) within ~30 iterations -- the polynomial-
# decay window is too short for a robust slope fit.  For a reference
# run, copy this YAML and increase ``n`` / ``m`` (e.g. n=500, m=1000)
# so methods take 150-200 iters to converge.  The aggregate stage's
# ``--rate-tail-fraction`` should then be set to ``0.3`` so the fit
# window sits squarely in the polynomial-decay phase.

include:
  - ../_base/problems/nonlinear_equations.yaml

problem:
  params:
    n: 20
    m: 40
    p: 4
    seed: 11        # overridden per-seed by run_benchmark --seeds

common:
  gamma_0: 1.0
  eps: 1.0e-12
  adaptive_search: true

methods:
  - include: [../_base/methods/gns_exact.yaml]
    n_iters: 200
  - include: [../_base/methods/gns_inexact.yaml]
    n_iters: 200
  - include: [../_base/methods/agns_practice.yaml]
    n_iters: 200
  - include: [../_base/methods/agns_theory.yaml]
    n_iters: 200
  - include: [../_base/methods/super_newton.yaml]
    n_iters: 200
  - include: [../_base/methods/accelerated_cubic_newton.yaml]
    n_iters: 200
  - include: [../_base/methods/monteiro_svaiter_acn.yaml]
    n_iters: 200
  - include: [../_base/methods/gradient.yaml]
    n_iters: 2000
  - include: [../_base/methods/fast_gradient.yaml]
    n_iters: 2000

output:
  save_dir: results/numerical/raw/rate_verification_nle
  title: "Nonlinear equations p=4 (n=20, m=40) -- rate verification"
