# Rate verification on Nonlinear Equations at p = 2.25.
#
# ``f(x) = (1/p) ||A x - b||^p`` with p = 2.25 gives a Hessian that is
# (L, nu)-H\"older with nu = p - 2 = 0.25.  Together with nle_p25, nle_p275,
# and nle_p4 this builds the four-panel rate-verification figure showing
# that AGNS-Theory attains the universal rate O(K^{-(2+nu)}) for every
# nu in [0, 1], without prior knowledge of nu.
#
# Sized at n=50, m=100 to give the polynomial-decay window time to be
# visible before the machine-precision floor at 1e-14.

include:
  - ../_base/problems/nonlinear_equations.yaml

problem:
  params:
    n: 50
    m: 100
    p: 2.25
    seed: 11

common:
  gamma_0: 1.0
  eps: 1.0e-12
  adaptive_search: true

methods:
  - include: [../_base/methods/gns_exact.yaml]
    n_iters: 300
  - include: [../_base/methods/gns_inexact.yaml]
    n_iters: 300
  - include: [../_base/methods/agns_practice.yaml]
    n_iters: 300
  - include: [../_base/methods/agns_theory.yaml]
    n_iters: 300
  - include: [../_base/methods/super_newton.yaml]
    n_iters: 300
  - include: [../_base/methods/accelerated_cubic_newton.yaml]
    n_iters: 300
  - include: [../_base/methods/monteiro_svaiter_acn.yaml]
    n_iters: 300
  - include: [../_base/methods/gradient.yaml]
    n_iters: 3000
  - include: [../_base/methods/fast_gradient.yaml]
    n_iters: 3000

output:
  save_dir: results/numerical/raw/rate_verification_nle_nu025
  title: "Nonlinear equations p=2.25 (n=50, m=100) -- nu = 0.25"
