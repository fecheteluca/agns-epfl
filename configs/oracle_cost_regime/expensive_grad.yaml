# Oracle-cost regime: where AGNS-Theory's per-iteration gradient
# economy translates into wall-clock gains.
#
# AGNS-Theory achieves the same asymptotic rate as cubic-Newton but
# with strictly fewer gradient evaluations per iteration.  This
# advantage only materialises in wall-clock when one gradient call
# dominates the per-iteration cost -- e.g. when the gradient passes
# through a large model or a streaming data loader.
#
# This campaign constructs that regime with logistic regression at a
# large m (so each grad costs O(m n) with m >> n), keeping n small
# enough that the Hessian factorisation O(n^3) is negligible relative
# to the gradient pass.  Under that cost balance, AGNS-Theory's lower
# gradient count per outer iter wins on wall-clock even though its
# inner search ratchets up the iteration count.

include:
  - ../_base/problems/logistic_regression_synthetic.yaml

problem:
  params:
    m: 50000        # large m -> gradient pass dominates
    n: 40           # small n -> Hessian inversion is cheap
    reg: 1.0e-3
    seed: 0

common:
  gamma_0: 1.0
  eps: 1.0e-9
  adaptive_search: true

methods:
  - include: [../_base/methods/agns_theory.yaml]
    n_iters: 50
  - include: [../_base/methods/agns_practice.yaml]
    n_iters: 50
  - include: [../_base/methods/gns_exact.yaml]
    n_iters: 50
  - include: [../_base/methods/super_newton.yaml]
    n_iters: 50
  - include: [../_base/methods/cubic_newton.yaml]
    n_iters: 50
  - include: [../_base/methods/accelerated_cubic_newton.yaml]
    n_iters: 50

output:
  save_dir: results/numerical/raw/oracle_cost_regime
  title: "Oracle-cost regime (m=50k, n=40) -- where AGNS-Theory wins"
