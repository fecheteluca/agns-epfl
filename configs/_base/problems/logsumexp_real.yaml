# Log-sum-exp on a real LIBSVM feature matrix (sparsity preserved).
# The default ``path`` points at ``data/binary/mushrooms`` which is what
# scripts/download_data.sh writes; override at the leaf level to swap
# datasets.
problem:
  type: logsumexp_real
  params:
    path: data/binary/mushrooms
    mu: 1.0
    seed: 0
