# Wirtinger-flow phase retrieval -- the canonical non-convex quartic
# loss with multiple local minima.  Defaults give an over-determined
# (m >> n) problem so spectral initialisation lands close to the
# global optimum.
problem:
  type: phase_retrieval_synthetic
  params:
    m: 600
    n: 30
    noise_std: 0.0
    seed: 0
