# Small smooth-CNN classifier on synthetic Gaussian images.  The
# heaviest neural-network problem in the suite measured in parameter
# count (~250 -- still tractable for the full-Hessian baselines).
problem:
  type: cnn_classifier_synthetic
  params:
    n_samples: 64
    img_size: 8
    n_channels: 1
    n_classes: 4
    reg: 1.0e-3
    seed: 0
    device: cpu
