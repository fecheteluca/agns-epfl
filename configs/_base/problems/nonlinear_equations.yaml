# p-norm sum-of-squares of linear residuals.  Non-quadratic curvature
# (p=4 is the default), so the Hessian is genuinely Lipschitz and the
# adaptive-search dial is exercised.  Matches byte-identical
# reference.
problem:
  type: nonlinear_equations
  params:
    n: 20
    m: 40
    p: 4
    seed: 11
