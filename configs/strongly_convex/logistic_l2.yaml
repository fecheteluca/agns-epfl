# Strongly-convex benchmark on a non-quadratic objective.
#
# L2-regularised binary logistic regression: ``f(x) = (1/m) sum_i
# log(1 + exp(-y_i a_i^T x)) + (mu/2) ||x||^2``.  Unlike the
# ``ridge_synthetic`` companion (a pure quadratic with constant
# Hessian and L_2 = 0), the logistic loss is non-quadratic with a
# non-zero Hessian-Lipschitz constant L_2 = Theta(max_i ||a_i||^3 / m),
# so this campaign exercises the (L_2/mu)^{1/3} term in the strongly-
# convex rate.
#
# With ``reg = 0.1`` the strong-convexity constant is mu = 0.1 by
# construction; the synthetic Gaussian features yield L_2 of order
# unity, so L_2/mu is order ten and (L_2/mu)^{1/3} is a meaningful
# constant in the iteration complexity bound.

include:
  - ../_base/problems/logistic_regression_synthetic.yaml

problem:
  params:
    m: 2000
    n: 100
    reg: 1.0e-1
    seed: 0

common:
  gamma_0: 1.0
  eps: 1.0e-12
  adaptive_search: true

methods:
  - include: [../_base/methods/gns_exact.yaml]
    n_iters: 100
  - include: [../_base/methods/agns_practice.yaml]
    n_iters: 100
  - include: [../_base/methods/agns_theory.yaml]
    n_iters: 100
  - include: [../_base/methods/super_newton.yaml]
    n_iters: 100
  - include: [../_base/methods/newton.yaml]
    n_iters: 100
  - include: [../_base/methods/lbfgs.yaml]
    n_iters: 100
  - include: [../_base/methods/accelerated_cubic_newton.yaml]
    n_iters: 100
  - include: [../_base/methods/gradient.yaml]
    n_iters: 1000
  - include: [../_base/methods/fast_gradient.yaml]
    n_iters: 1000

output:
  save_dir: results/numerical/raw/strongly_convex_logistic
  title: "L2-regularised logistic regression (mu = 0.1) -- accelerated linear rate"
