# Strongly-convex benchmark on a quadratic with constant Hessian.
#
# Ridge regression with reg = 0.1 is 0.1-strongly convex; the Hessian
# H = X^T X / m + reg I is constant in w, so the Hessian-Lipschitz
# constant L_2 = 0.  Under (mu, L_2)-strong convexity the accelerated
# methods are expected to exhibit a linear-rate slope on a semi-log
# residual axis.  The rate_loglog figure additionally shows the
# steeper-than-polynomial slope as a sanity check.

include:
  - ../_base/problems/ridge_regression_synthetic.yaml

problem:
  params:
    m: 1000
    n: 100
    reg: 1.0e-1
    seed: 0

common:
  gamma_0: 1.0
  eps: 1.0e-12
  adaptive_search: true

methods:
  - include: [../_base/methods/gns_exact.yaml]
    n_iters: 100
  - include: [../_base/methods/agns_practice.yaml]
    n_iters: 100
  - include: [../_base/methods/agns_theory.yaml]
    n_iters: 100
  - include: [../_base/methods/super_newton.yaml]
    n_iters: 100
  - include: [../_base/methods/newton.yaml]
    n_iters: 100
  - include: [../_base/methods/lbfgs.yaml]
    n_iters: 100
  - include: [../_base/methods/accelerated_cubic_newton.yaml]
    n_iters: 100
  - include: [../_base/methods/gradient.yaml]
    n_iters: 1000
  - include: [../_base/methods/fast_gradient.yaml]
    n_iters: 1000

output:
  save_dir: results/numerical/raw/strongly_convex_ridge
  title: "Ridge regression (mu = 0.1) -- accelerated linear rate"
