# Rosenbrock recast as a p-norm NLE problem.  Lets the AGNS / GNS family
# exercise the chain-rule second-derivative term.
#
# WSM-family methods are intentionally omitted: ``make_rosenbrock_nle``
# registers ``approx_hess_fn_wsm: None`` because the rank-1 Fisher
# decomposition required by the Woodbury solver does not apply to this
# 2-residual form.

include:
  - ../_base/problems/rosenbrock_nle.yaml

common:
  gamma_0: 1.0
  eps: 1.0e-10
  adaptive_search: true

methods:
  - include: [../_base/methods/gns_exact.yaml]
    n_iters: 300
  - include: [../_base/methods/gns_inexact.yaml]
    n_iters: 300
  - include: [../_base/methods/agns_inexact.yaml]
    n_iters: 300
  - include: [../_base/methods/agns_exact.yaml]
    n_iters: 300
  - include: [../_base/methods/agns_exact_norestart.yaml]
    n_iters: 300
  - include: [../_base/methods/agns_inexact_norestart.yaml]
    n_iters: 300
  - include: [../_base/methods/super_newton.yaml]
    n_iters: 300
  - include: [../_base/methods/trust_region.yaml]
    n_iters: 300
  - include: [../_base/methods/gradient.yaml]
    n_iters: 5000

output:
  save_dir: results/numerical/raw/rosenbrock_nle
  title: "Rosenbrock NLE (non-convex, p=4)"
