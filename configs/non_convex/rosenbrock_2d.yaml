# Canonical 2-D Rosenbrock banana.

include:
  - ../_base/problems/rosenbrock_2d.yaml

common:
  gamma_0: 1.0
  eps: 1.0e-12
  adaptive_search: true

methods:
  - include: [../_base/methods/gns_exact.yaml]
    n_iters: 200
  - include: [../_base/methods/agns_exact.yaml]
    n_iters: 200
  - include: [../_base/methods/agns_exact_norestart.yaml]
    n_iters: 200
  - include: [../_base/methods/super_newton.yaml]
    n_iters: 200
  - include: [../_base/methods/trust_region.yaml]
    n_iters: 200
  - include: [../_base/methods/lbfgs.yaml]
    n_iters: 500
  - include: [../_base/methods/gradient.yaml]
    n_iters: 5000
  - include: [../_base/methods/heavy_ball.yaml]
    n_iters: 5000

output:
  save_dir: results/numerical/raw/rosenbrock_2d
  title: "Rosenbrock 2D (non-convex banana)"
