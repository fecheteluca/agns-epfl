# Multinomial logistic regression on synthetic Gaussian features.
# Three classes, n_features = 20 -> parameter count n * K = 60.
# Cross-entropy loss with L2 regularisation; Lipschitz Hessian.

include:
  - ../_base/problems/softmax_regression_synthetic.yaml

problem:
  params:
    m: 500
    n: 20
    K: 3
    reg: 1.0e-3
    seed: 0

common:
  gamma_0: 1.0
  eps: 1.0e-10
  adaptive_search: true

methods:
  - include: [../_base/methods/gns_exact.yaml]
    n_iters: 150
  - include: [../_base/methods/agns_practice.yaml]
    n_iters: 150
  - include: [../_base/methods/agns_theory.yaml]
    n_iters: 150
  - include: [../_base/methods/super_newton.yaml]
    n_iters: 150
  - include: [../_base/methods/newton.yaml]
    n_iters: 150
  - include: [../_base/methods/lbfgs.yaml]
    n_iters: 150
  - include: [../_base/methods/accelerated_cubic_newton.yaml]
    n_iters: 150
  - include: [../_base/methods/trust_region.yaml]
    n_iters: 150
  - include: [../_base/methods/gradient.yaml]
    n_iters: 1500
  - include: [../_base/methods/fast_gradient.yaml]
    n_iters: 1500

output:
  save_dir: results/numerical/raw/softmax_regression
  title: "Softmax regression (m=500, n=20, K=3)"
