# Medium-scale synthetic logistic regression (n=500).
# Companion to the n=50 default and the n=200/n=800 scaling sweep.

include:
  - ../_base/problems/logistic_regression_synthetic.yaml

problem:
  params:
    n: 500
    m: 1000
    reg: 1.0e-3

common:
  gamma_0: 1.0
  eps: 1.0e-10
  adaptive_search: true

methods:
  - include: [../_base/methods/gns_exact.yaml]
    n_iters: 150
  - include: [../_base/methods/gns_inexact.yaml]
    n_iters: 150
  - include: [../_base/methods/agns_inexact.yaml]
    n_iters: 150
  - include: [../_base/methods/agns_exact.yaml]
    n_iters: 150
  - include: [../_base/methods/agns_exact_norestart.yaml]
    n_iters: 150
  - include: [../_base/methods/agns_inexact_norestart.yaml]
    n_iters: 150
  - include: [../_base/methods/super_newton.yaml]
    n_iters: 150
  - include: [../_base/methods/newton.yaml]
    n_iters: 150
  - include: [../_base/methods/lbfgs.yaml]
    n_iters: 500
  - include: [../_base/methods/trust_region.yaml]
    n_iters: 150
  - include: [../_base/methods/accelerated_cubic_newton.yaml]
    n_iters: 150
  - include: [../_base/methods/gradient.yaml]
    n_iters: 1500
  - include: [../_base/methods/fast_gradient.yaml]
    n_iters: 1500

output:
  save_dir: results/numerical/raw/convex_lipschitz_lr_n500
  title: "Logistic regression (synthetic, n=500)"
