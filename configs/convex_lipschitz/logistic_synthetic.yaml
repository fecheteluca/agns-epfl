# Convex objective with Lipschitz Hessian.
#
# Synthetic logistic regression with mild L2 regularisation: the
# objective is mu-strongly-convex (mu = reg = 1e-3) with a globally
# Lipschitz Hessian.  A realistic ML loss used to compare AGNS against
# the second-order and ML baselines on a standard benchmark.

include:
  - ../_base/problems/logistic_regression_synthetic.yaml

problem:
  params:
    m: 1000
    n: 100
    reg: 1.0e-3
    seed: 0

common:
  gamma_0: 1.0
  eps: 1.0e-10
  adaptive_search: true

methods:
  - include: [../_base/methods/gns_exact.yaml]
    n_iters: 150
  - include: [../_base/methods/gns_inexact.yaml]
    n_iters: 150
  - include: [../_base/methods/agns_practice.yaml]
    n_iters: 150
  - include: [../_base/methods/agns_theory.yaml]
    n_iters: 150
  - include: [../_base/methods/super_newton.yaml]
    n_iters: 150
  - include: [../_base/methods/newton.yaml]
    n_iters: 150
  - include: [../_base/methods/lbfgs.yaml]
    n_iters: 150
  - include: [../_base/methods/trust_region.yaml]
    n_iters: 150
  - include: [../_base/methods/accelerated_cubic_newton.yaml]
    n_iters: 150
  - include: [../_base/methods/gradient.yaml]
    n_iters: 1500
  - include: [../_base/methods/fast_gradient.yaml]
    n_iters: 1500

output:
  save_dir: results/numerical/raw/convex_lipschitz_lr
  title: "Logistic regression (m=1000, n=100, reg=1e-3)"
