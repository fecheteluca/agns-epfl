# Ill-conditioned synthetic logistic regression.  The covariance of the
# features is scaled to ~1e6 condition number; tests AGNS's robustness
# under poor geometry.

include:
  - ../_base/problems/logistic_regression_synthetic.yaml

problem:
  params:
    n: 200
    m: 1000
    reg: 1.0e-6

common:
  gamma_0: 1.0
  eps: 1.0e-10
  adaptive_search: true

methods:
  - include: [../_base/methods/gns_exact.yaml]
    n_iters: 200
  - include: [../_base/methods/gns_inexact.yaml]
    n_iters: 200
  - include: [../_base/methods/agns_inexact.yaml]
    n_iters: 200
  - include: [../_base/methods/agns_exact.yaml]
    n_iters: 200
  - include: [../_base/methods/agns_exact_norestart.yaml]
    n_iters: 200
  - include: [../_base/methods/agns_inexact_norestart.yaml]
    n_iters: 200
  - include: [../_base/methods/super_newton.yaml]
    n_iters: 200
  - include: [../_base/methods/newton.yaml]
    n_iters: 200
  - include: [../_base/methods/trust_region.yaml]
    n_iters: 200
  - include: [../_base/methods/gradient.yaml]
    n_iters: 2000
  - include: [../_base/methods/fast_gradient.yaml]
    n_iters: 2000

output:
  save_dir: results/numerical/raw/convex_lipschitz_lr_illcond
  title: "Logistic regression (synthetic, ill-conditioned)"
